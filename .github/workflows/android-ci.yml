name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      # 共享核心源码（android 构建时通过 syncCoreLibs 从 src/ 同步），资源与测试同理
      - 'src/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

# 同一分支上的新提交会取消仍在排队/运行中的旧运行，避免浪费 CI 资源
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================
  # Android 单元测试（在 JVM 上运行，不需要模拟器）
  # ============================================================
  unit-test:
    name: Unit Tests (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # setup-gradle 会自动配置依赖缓存与构建缓存（gradle-build-action 已被取代）
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run app unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Run shared-core tests (Android classpath)
        working-directory: android
        run: ./gradlew :shared-test:test --no-daemon --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          if-no-files-found: ignore
          path: |
            android/app/build/reports/tests/
            android/shared-test/build/reports/tests/

  # ============================================================
  # APK 构建检查（debug + release，release 会触发 R8 混淆检查）
  # ============================================================
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # release 开启 R8 混淆与资源缩减，作为发布构建的校验
      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          if-no-files-found: warn
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
