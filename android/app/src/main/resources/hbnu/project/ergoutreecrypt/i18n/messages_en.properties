options.compressBefore.tip=Package the selection into a single archive of the format below before encrypting, then encrypt the whole archive; the archive keeps the original folder structure. ZIP uses native AES-256 (compatible with 7-Zip / Bandizip / Windows Explorer, etc.); leaving the archive password empty produces an archive without a password. Mutually exclusive with "Compress after encrypt"; can be combined with "Compress with ZStandard".
options.compress.level=Compression level
options.compress.level.tip=Choose the Zstandard compression level: 1 is fastest with the largest output, 22 is smallest but slowest.
options.compressAfter=Compress after encrypt
options.compressAfter.tip=Package the encrypted output into an archive. ZIP uses native AES-256 (compatible with 7-Zip / Bandizip / Windows Explorer, etc.). Custom archive encryption is ON: GZ / TAR.GZ / 7Z accept an archive password and use this tool's whole-archive AES wrap (MAGIC) — extractable by this tool only; external tools cannot recognize the password. Leaving the archive password empty creates a plain unencrypted archive.
options.compressAfter.tip.nocustom=Package the encrypted output into an archive. ZIP uses native AES-256 (compatible with 7-Zip / Bandizip / Windows Explorer, etc.) and accepts an archive password below. GZ / TAR.GZ / 7Z do not support passwords right now (enable "custom archive encryption for non-zip formats" in Settings to protect them) and always produce plain archives.
