name: Desktop CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/desktop-ci.yml'
  workflow_dispatch:

# 同一分支上的新提交会取消仍在排队/运行中的旧运行，避免浪费 CI 资源
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================
  # 桌面端（JavaFX / Maven）：编译 -> 全量单元测试 -> jlink 打包
  # ============================================================
  build-and-test:
    name: Build, Test & Package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          # 自动缓存 ~/.m2，加速依赖解析
          cache: maven

      # 编译阶段即校验 JPMS 模块声明与全部依赖是否可解析
      - name: Compile
        run: mvn -B --no-transfer-progress clean compile

      # 全量单元测试：crypto / encoding / fileops / volume / stego / filestego 等
      # 提高堆上限以容纳 Argon2 派生所需的堆外内存
      - name: Run unit tests
        env:
          MAVEN_OPTS: '-Xmx3g -Dfile.encoding=UTF-8'
        run: mvn -B --no-transfer-progress test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-reports
          if-no-files-found: ignore
          path: target/surefire-reports/

      # 打包 jlink 运行时镜像，作为桌面端“可发布产物”的构建检查
      - name: Package jlink image
        run: mvn -B --no-transfer-progress javafx:jlink

      - name: Upload runtime image
        uses: actions/upload-artifact@v4
        with:
          name: desktop-jlink-image
          if-no-files-found: warn
          path: |
            target/ErgouTreeCrypt/
            target/ErgouTreeCrypt-*.zip
