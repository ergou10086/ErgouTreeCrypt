options.compress.level.tip=选择 Zstandard 压缩档位：1 最快体积最大，22 压缩率最高但速度最慢。
options.compressAfter=加密后压缩
options.compressAfter.tip=加密完成后将输出文件打包为指定归档格式。ZIP 使用原生 AES-256 加密（兼容 7-Zip / Bandizip / Windows 资源管理器等）。已开启「工具特有压缩包加密」：GZ / TAR.GZ / 7Z 可填写归档密码，采用本工具特有的整体 AES 包裹加密（MAGIC），仅能用本工具解压，外部工具无法识别其密码。归档密码留空则生成无密码明文归档。
options.compressAfter.tip.nocustom=加密完成后将输出文件打包为指定归档格式。ZIP 使用原生 AES-256 加密（兼容 7-Zip / Bandizip / Windows 资源管理器等），可在下方填写归档密码。GZ / TAR.GZ / 7Z 当前不支持密码（如需为其加密，请在设置中开启「为非 zip 格式开启工具特有压缩包加密方式」），始终生成明文归档。
options.archivePassword.placeholder=归档密码（可选；留空则用加密密码）
options.archivePassword.placeholder.nofallback=归档密码（可选；留空则压缩包无密码）
options.archivePassword.placeholder.custom=归档密码（可选；工具特有加密，仅本工具可解；留空则用加密密码）
options.archivePassword.placeholder.custom.nofallback=归档密码（可选；工具特有加密，仅本工具可解；留空则压缩包无密码）
options.decryptArchivePassword.placeholder=压缩包密码（可选；留空则在遇到加密压缩包时询问）
options.compress.format.zip=ZIP
options.compress.format.gz=GZ
options.compress.format.targz=TAR.GZ
options.compress.format.7z=7Z
options.split=分卷输出
options.split.size=每卷大小 (MiB)
options.keyfiles=密钥文件
