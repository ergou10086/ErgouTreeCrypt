about.title=About ErgouTreeCrypt
about.name=ErgouTreeCrypt
about.tagline=Secure · Reliable · Modern
about.text=ErgouTreeCrypt is a Java-enhanced migration implementation of Picocrypt-NG, mainly focused on audio and video file applications. \nCore: Argon2id + XChaCha20 + Serpent + Reed-Solomon.\nDecrypts existing .pcv; new files use the .ergou format.
about.version=Version 2.9.0
about.tab.about=About
about.author=Author: ErgouTree
about.tab.license=License
about.tab.terms=Terms of Use
about.tab.credits=Credits
about.license.title=GNU General Public License v3.0 (GPL-3.0)
about.license.body=ErgouTreeCrypt is released under the GNU General Public License v3.0 (GPL-3.0).\nIt is a Java-enhanced migration implementation of Picocrypt-NG and keeps the same license as its upstream Picocrypt / Picocrypt-NG, continuing their open-source grant.\n\nYou are free to:\n· run this software for any purpose, including commercial use;\n· study how the software works and modify it as you wish;\n· redistribute copies to others;\n· distribute your own modified versions.\n\nThese freedoms come with conditions:\n· when you distribute this software or a derivative work, you must make the complete source code available under GPL-3.0 as well;\n· you must keep the original copyright and license notices and state what you changed;\n· you may not add further restrictions that prevent downstream users from exercising the rights the GPL grants;\n· the software is provided "AS IS", without any express or implied warranty.\n\nThe full license text is available at https://www.gnu.org/licenses/gpl-3.0.html
about.terms.body=By using this tool you understand and accept the following terms.\n\n1. Lawful use\nUse this tool only on data you are lawfully entitled to handle, and for authorized security testing, teaching, or research. Do not use it for any purpose that violates applicable law.\n\n2. No reverse engineering or unpacking\n· You must not decompile, disassemble, unpack, or otherwise extract the encryption core or algorithm implementations from this tool's executables, packages, or Android APK.\n· You must not remove, obscure, or alter the copyright notices, license identifiers, or author information of this tool.\n· You must not repackage the extracted encryption core, algorithm implementations, or key-derivation code into closed-source products or any other distribution that violates GPL-3.0.\n\n3. No misleading modification or distribution\n· You must not distribute a modified build under the ErgouTreeCrypt name, or present it as an "official version".\n· You must not bypass password checks, hide the passwordless-mode notice, or misrepresent security guarantees such as encryption strength by modifying the code.\n\n4. Your responsibility for data safety\n· Lost passwords and keyfiles cannot be recovered. Keep your own backups; this tool contains no backdoor or recovery mechanism.\n· "Passwordless mode" uses a public built-in password. It only prevents accidental reading and provides no confidentiality, so do not use it for sensitive data.\n· Features such as format-preserving encryption and steganography modify file contents, so always keep a copy of the originals.\n\n5. Disclaimer\nThe authors accept no liability for any data corruption, loss, or other damage caused by using, or being unable to use, this tool.
about.credits.body=This tool builds on the following open-source projects. Each component is governed by its own license.\n\n· Picocrypt / Picocrypt-NG — original design and algorithm flow (GPL-3.0)\n· OpenJDK / JavaFX — runtime and desktop UI framework (GPL-2.0-with-classpath-exception)\n· Bouncy Castle — cryptographic primitives (Bouncy Castle License)\n· zstd-jni — Zstandard compression (BSD-2-Clause)\n· zip4j, Apache Commons Compress, XZ for Java — archiving and compression (Apache-2.0 / Public Domain)\n· ControlsFX, Ikonli, BootstrapFX — UI components and icons (BSD-3-Clause / Apache-2.0)\n· Kotlin, Jetpack Compose, AndroidX — Android client (Apache-2.0)\n· Argon2 reference implementation — memory-hard key derivation (CC0-1.0 / Apache-2.0)

