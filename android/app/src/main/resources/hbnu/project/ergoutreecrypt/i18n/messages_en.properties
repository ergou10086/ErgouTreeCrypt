fileStego.option.compress.mobile.warning.header=Mobile compatibility notice
fileStego.option.compress.mobile.warning=Content compressed with Zstandard cannot be extracted by the mobile version. Do not enable "Compress before encryption" if you need to extract this file on mobile.
fileStego.option.integrity=Store integrity check
fileStego.option.integrity.tip=Appends a BLAKE2b-512 MAC to the payload for integrity verification on extraction.
fileStego.option.stealth=Stealth mode
fileStego.option.stealth.tip=Requires password. Uses a password-derived dynamic magic instead of a fixed ASCII magic to avoid detection by security tools.
fileStego.option.obfuscate=Obfuscate file size
fileStego.option.obfuscateSize=Target size (KB):
fileStego.option.obfuscate.tip=Pads the output file to the target size to hide the true data volume.
fileStego.option.bruteForce=Anti brute-force
fileStego.option.bruteForce.tip=Limits extraction attempts to at most 10 per file.
fileStego.option.embedMode=Embed method
fileStego.option.embedMode.tip=Choose where the payload is embedded. A custom region (e.g. PNG stEG / WAV STEG chunk) is stealthier than trailing append but slightly less compatible.
fileStego.option.embedAppend=Trailing append (compatibility first)
fileStego.option.embedChunk=Custom region (stealth first)

