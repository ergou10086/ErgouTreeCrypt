# ===== 设置对话框 =====
settings.title=设置
settings.section.theme=外观
settings.section.decrypt=解密
settings.section.encrypt=加密默认值
settings.section.behavior=行为
settings.autoDecompress=自动解压解密
settings.autoDecompress.tip=当输入为压缩包时，自动解压后扫描其中加密文件并解密。默认开启。
settings.confirmOverwrite=覆盖文件前确认
settings.confirmOverwrite.tip=若输出文件已存在，弹出确认对话框，避免误覆盖重要文件。
settings.defaultPasswordless=默认无密码模式
settings.defaultPasswordless.tip=新建加密任务时默认不要求密码（使用内置公开密码加密），适合无保密需求的快速操作。
settings.defaultParanoid=默认偏执模式
settings.defaultParanoid.tip=新建加密任务时默认开启 Serpent+XChaCha20 双重加密。
settings.kdfTier=KDF 强度档位：
settings.kdfTier.tip=密钥派生(Argon2)的内存/轮数档位。默认「均衡 256 MiB」可在移动端堆内秒级解密；「强 1 GiB」与「偏执 1 GiB」抗暴力破解更强，但移动端需走原生派生(约十几秒)且仅建议在桌面解密。已有文件不受影响。
kdfTier.BALANCED=均衡 256 MiB（移动端友好）
kdfTier.STRONG=强 1 GiB（桌面端）
kdfTier.PARANOID=偏执 1 GiB（最高强度）
settings.defaultReedSolomon=默认纠错码
settings.defaultReedSolomon.tip=新建加密任务时默认开启 Reed-Solomon 纠错，体积增加约6%但可抗损坏。
settings.defaultFormat=默认压缩格式：
settings.defaultFormat.tip=加密后压缩功能中默认使用的归档格式。
settings.defaultSplitSize=默认分卷大小：
settings.defaultSplitSize.tip=启用分卷时默认每卷大小(MiB)，可每次加密时调整。
settings.rememberOutputDir=记住上次输出目录
settings.rememberOutputDir.tip=浏览选择输出路径后，下次浏览时自动定位到上次使用的目录。
settings.autoClearPassword=加密后自动清除密码
settings.autoClearPassword.tip=加密任务完成后自动清空密码框，避免密码残留被旁人看到。
settings.archiveCustomEncryption=为非 zip 格式开启工具特有压缩包加密方式
settings.archiveCustomEncryption.tip=开启后，GZ / TAR.GZ / 7Z 可设置密码，采用本工具特有的整体 AES-256 包裹加密（仅能用本工具解密，外部工具无法识别密码）。关闭（默认）时，这三种格式不支持密码，始终生成明文压缩包。ZIP 始终使用原生 AES，不受此开关影响。
settings.archivePasswordFallback=压缩包密码留空则使用加密密码
settings.archivePasswordFallback.tip=开启后：加密后压缩时若未填写归档密码，将自动使用文件加密密码保护压缩包。对 ZIP 始终生效；对 GZ / TAR.GZ / 7Z 仅在同时开启「工具特有压缩包加密方式」时才生效。关闭后（默认）：归档密码留空则生成无密码明文压缩包。
settings.threadCount=并行线程数：
settings.threadCount.tip=同时处理多个文件的线程数量（1-16）。默认4。总大小达到下方阈值、或解压后解密时会强制单线程。密钥派生始终全局串行，避免多路 1 GiB Argon2 叠加导致闪退。
settings.batchSerialThreshold=大批次单线程阈值（GiB）：
settings.batchSerialThreshold.tip=一次文件夹操作的输入总大小达到该值（默认 10 GiB）时改为逐文件单线程。压缩包解压后再解密始终单线程。单个文件失败会跳过并在结束时汇总。
batch.summary.title=批量处理结果
batch.summary.body=成功 %d 个，失败 %d 个，跳过 %d 个。
batch.summary.serial.threshold=因总大小达到阈值，已切换为单线程。
batch.summary.serial.archive=解压后解密使用单线程逐文件处理。
batch.summary.serial.oom=因内存不足已降级为单线程。
batch.summary.threads=文件并行线程数：%d
batch.summary.failures=失败文件：
batch.summary.partial=部分文件未能完成
