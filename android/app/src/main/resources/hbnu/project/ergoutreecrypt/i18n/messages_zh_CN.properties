about.title=关于 ErgouTreeCrypt
about.name=ErgouTreeCrypt
about.tagline=安全 · 可靠 · 现代
about.text=ErgouTreeCrypt 是 Picocrypt-NG 的 Java 增强实现，主要集中音视频文件领域。\n核心：Argon2id + XChaCha20 + Serpent + Reed-Solomon。\n可解密既有 .pcv，新文件采用 .ergou 格式。
about.version=版本 2.8.0
about.tab.about=关于
about.author=作者：ErgouTree
about.tab.license=许可证
about.tab.terms=使用规约
about.tab.credits=开源致谢
about.license.title=GNU General Public License v3.0（GPL-3.0）
about.license.body=ErgouTreeCrypt 以 GNU General Public License v3.0（GPL-3.0）发布。\n本项目是 Picocrypt-NG 的 Java 增强实现，与上游 Picocrypt / Picocrypt-NG 采用同一许可证，以延续其开源授权。\n\n您可以自由地：\n· 为任何目的运行本软件，包括商业用途；\n· 研究本软件的运作方式，并按需修改；\n· 再分发副本给他人；\n· 分发自己修改后的版本。\n\n行使上述自由的前提是：\n· 分发本软件或其衍生作品时，必须一并提供完整源代码，并以 GPL-3.0 授权；\n· 必须保留原始版权与许可证声明，并标明自己所做的修改；\n· 不得附加任何额外限制来阻止下游用户行使 GPL 授予的权利；\n· 本软件按「现状」提供，不附带任何明示或默示担保。\n\n完整许可证文本见 https://www.gnu.org/licenses/gpl-3.0.html
about.terms.body=使用本工具即表示您理解并同意以下约定。\n\n一、合法用途\n本工具仅应用于您拥有合法处置权的数据，以及经授权的安全测试、教学与研究。请勿用于任何违反当地法律法规的用途。\n\n二、禁止逆向与拆包\n· 禁止对本工具的可执行文件、安装包与 Android 安装包（APK）进行反编译、反汇编、脱壳、拆包，或提取其中的加密核心与算法实现；\n· 禁止移除、遮蔽或篡改本工具的版权声明、许可证标识与作者信息；\n· 禁止将提取出的加密核心、算法实现或密钥派生代码用于二次封装、闭源产品或任何违反 GPL-3.0 的分发形式。\n\n三、禁止误导性修改与传播\n· 禁止发布修改版后仍以 ErgouTreeCrypt 名义传播，或以「官方版本」误导他人；\n· 禁止通过修改代码绕过密码校验、隐去无密码模式提示，或伪造加密强度等安全承诺。\n\n四、数据安全责任\n· 密码与密钥文件一旦丢失将无法恢复，请自行妥善备份，本工具不含任何后门或找回机制；\n· 「无密码模式」使用的是公开的内置密码，只能防止无意间被读取，不构成任何保密性，请勿用于敏感数据；\n· 格式保持加密、隐写等功能会改变文件内容，操作前请务必保留原始文件副本。\n\n五、免责\n因使用或无法使用本工具而造成的任何数据损坏、丢失或其他损失，作者不承担责任。
about.credits.body=本工具的实现依赖以下开源项目，特此致谢。各组件的许可证以其自身声明为准。\n\n· Picocrypt / Picocrypt-NG —— 原始设计与算法流程（GPL-3.0）\n· OpenJDK / JavaFX —— 运行环境与桌面界面框架（GPL-2.0-with-classpath-exception）\n· Bouncy Castle —— 密码学原语（Bouncy Castle License）\n· zstd-jni —— Zstandard 压缩（BSD-2-Clause）\n· zip4j、Apache Commons Compress、XZ for Java —— 归档与压缩（Apache-2.0 / Public Domain）\n· ControlsFX、Ikonli、BootstrapFX —— 界面组件与图标（BSD-3-Clause / Apache-2.0）\n· Kotlin、Jetpack Compose、AndroidX —— Android 客户端（Apache-2.0）\n· Argon2 参考实现 —— 内存硬密钥派生（CC0-1.0 / Apache-2.0）

