# Options
stego.options.label=Options
stego.option.lsbDepth=LSB Depth:
stego.option.lsbDepth.tip=Number of least significant bits embedded per pixel channel. Higher depth = more capacity but more visible artifacts. 1 = at most 1 change per channel (invisible), 4 = at most 15 change (potentially visible noise).
stego.option.integrity=Store integrity check (BLAKE2b MAC)
stego.option.integrity.tip=Appends a BLAKE2b-512 MAC of the original file, allowing integrity verification after extraction.
stego.option.stealth=Stealth mode (HMAC-derived magic, avoids fixed-string detection)
stego.option.stealth.tip=Requires password. Uses password-derived magic instead of fixed ASCII magic to avoid detection by tools like strings.
stego.option.obfuscate=Obfuscate file size (append random padding)
stego.option.obfuscateSize=Target size (KB):
stego.option.obfuscate.tip=Pads the output file to the specified size, hiding the true data volume.
stego.option.bruteForce=Anti brute-force (limit extraction attempts)
stego.option.bruteForce.tip=Allows at most 10 extraction attempts per file; requires manual confirmation after exceeding threshold.
stego.toast.invalid.size=Please enter a valid target size (e.g. 500 means 500KB)

